services:
  boodschappenlijstje:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-roebenk}/boodschappenlijstje:latest
    build: .
    container_name: boodschappenlijstje
    restart: unless-stopped
    ports:
      - "${PORT:-3017}:3000"
    volumes:
      - "/mnt/user/appdata/boodschappenlijstje:/data"
    environment:
      TZ: Europe/Amsterdam
      DATA_DIR: /data
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_DEFAULT_MODEL: ${OPENROUTER_DEFAULT_MODEL:-google/gemini-2.5-flash-lite}
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-openai/gpt-4.1-mini}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      PICNIC_MIN_ORDER_CENTS: ${PICNIC_MIN_ORDER_CENTS:-3500}
      PICNIC_COUNTRY_CODE: ${PICNIC_COUNTRY_CODE:-NL}
